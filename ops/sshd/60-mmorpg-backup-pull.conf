# Pi: /etc/ssh/sshd_config.d/60-mmorpg-backup-pull.conf. Port 2222 = povlačenje backup-a sa Mac-a (ops/pull_backup_mac.sh):
# samo ključ, samo spy2901; ključ u authorized_keys ima restrict,from=Mac,command="rrsync -ro ~/mmorpg-backups".
# Port 22 na tailnet IP-ju i dalje preuzima Tailscale SSH; ovaj port ide na OpenSSH.
Port 22
Port 2222

Match LocalPort 2222
	PasswordAuthentication no
	AuthenticationMethods publickey
	AllowUsers spy2901
